name: RegWatch — Periodic Review

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Note optionnelle (ex: revue manuelle pré-présentation)"
        required: false
        default: ""

  # Cron — décommenter pour activer
  # schedule:
  #   - cron: "0 7 * * 1"      # Hebdomadaire — lundis 7h UTC
  #   - cron: "0 7 1,15 * *"   # Bimensuel — 1er et 15 du mois
  #   - cron: "0 7 1 * *"      # Mensuel — 1er du mois

jobs:
  review:
    runs-on: ubuntu-latest
    environment: regwatch        # ← indique quel environment utiliser
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run periodic review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          REVIEW_EMAIL_TO:   ${{ secrets.REVIEW_EMAIL_TO }}
          REVIEW_EMAIL_FROM: ${{ secrets.REVIEW_EMAIL_FROM }}
        run: python scripts/periodic_review.py

      - name: Commit updated review history
        run: |
          git config user.name  "RegWatch Bot"
          git config user.email "regwatch-bot@users.noreply.github.com"
          git add data/review_history.json
          git diff --staged --quiet || git commit -m "chore: periodic review $(date +'%Y-%m-%d')"
          git push
