name: RegWatch — Periodic Review

on:
  # Déclenchement manuel depuis GitHub Actions
  workflow_dispatch:
    inputs:
      note:
        description: "Note optionnelle (ex: revue manuelle pré-présentation)"
        required: false
        default: ""

  # Cron — modifier ici pour changer la fréquence
  # Désactivé par défaut (commenté) — décommenter pour activer
  # schedule:
  #   - cron: "0 7 * * 1"        # Hebdomadaire — tous les lundis à 7h UTC
  #   - cron: "0 7 1,15 * *"     # Bimensuel — 1er et 15 du mois à 7h UTC
  #   - cron: "0 7 1 * *"        # Mensuel — 1er du mois à 7h UTC

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Pour committer review_history.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install urllib3

      - name: Run periodic review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          SENDGRID_API_KEY:  ${{ secrets.SENDGRID_API_KEY }}
          REVIEW_EMAIL_TO:   ${{ secrets.REVIEW_EMAIL_TO }}
          REVIEW_EMAIL_FROM: ${{ secrets.REVIEW_EMAIL_FROM }}
        run: python scripts/periodic_review.py

      - name: Commit updated review history
        run: |
          git config user.name  "RegWatch Bot"
          git config user.email "regwatch-bot@users.noreply.github.com"
          git add data/review_history.json
          git diff --staged --quiet || git commit -m "chore: periodic review $(date +'%Y-%m-%d')"
          git push
