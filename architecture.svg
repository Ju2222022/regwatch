<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">

  <rect width="700" height="420" rx="12" fill="#ffffff"/>

  <!-- Table border -->
  <rect x="20" y="20" width="660" height="380" rx="6" fill="white" stroke="#1a3a8f" stroke-width="1.5"/>

  <!-- Header separator after each row: heights 60 each -->
  <line x1="20"  y1="80"  x2="680" y2="80"  stroke="#1a3a8f" stroke-width="1"/>
  <line x1="20"  y1="140" x2="680" y2="140" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="20"  y1="220" x2="680" y2="220" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="20"  y1="280" x2="680" y2="280" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="20"  y1="340" x2="680" y2="340" stroke="#1a3a8f" stroke-width="1"/>

  <!-- Vertical separator -->
  <line x1="130" y1="20" x2="130" y2="400" stroke="#1a3a8f" stroke-width="1"/>

  <!-- Row 1 — Agent 1 -->
  <text x="75"  y="56" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 1</text>
  <text x="400" y="43" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Monitors official sources (Tavily + Jina.ai), multi-topic,</text>
  <text x="400" y="61" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">auto pre-fill by category, persistent history</text>

  <!-- Row 2 — Agent 2 -->
  <text x="75"  y="116" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 2</text>
  <text x="400" y="116" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Extracts product specs</text>

  <!-- Row 3 — Agent 3 -->
  <text x="75"  y="167" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 3</text>
  <text x="400" y="155" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Classifies products against Decathlon's regulatory</text>
  <text x="400" y="173" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">framework (internal referentials legal/sub legal</text>
  <text x="400" y="191" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">categories)</text>

  <!-- Row 4 — Agent 4 -->
  <text x="75"  y="256" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 4</text>
  <text x="400" y="256" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Crosses alerts × internal referentials or product</text>

  <!-- Row 5 — Agent 5A -->
  <text x="75"  y="316" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 5A</text>
  <text x="400" y="304" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Audits and proposes updates to "My Conformity Box"</text>
  <text x="400" y="322" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">legal sheets by category</text>

  <!-- Row 6 — Agent 5B -->
  <text x="75"  y="376" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a3a8f" text-anchor="middle">Agent 5B</text>
  <text x="400" y="364" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">Generates product risk mapping with before/after</text>
  <text x="400" y="382" font-family="Segoe UI,sans-serif" font-size="12" fill="#222" text-anchor="middle">comparison post Agent 5A updates</text>

</svg>
