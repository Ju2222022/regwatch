<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
  <rect width="820" height="430" rx="10" fill="#ffffff"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="800" height="410" rx="6" fill="white" stroke="#1a3a8f" stroke-width="1.5"/>

  <!-- Vertical separators: col1=120, col2=480, col3=rest -->
  <line x1="120" y1="10"  x2="120" y2="420" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="600" y1="10"  x2="600" y2="420" stroke="#1a3a8f" stroke-width="1"/>

  <!-- Column headers -->
  <text x="65"  y="30" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#6b7bb8" text-anchor="middle">Agent</text>
  <text x="360" y="30" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#6b7bb8" text-anchor="middle">Function</text>
  <text x="710" y="30" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#6b7bb8" text-anchor="middle">Page</text>
  <line x1="10" y1="36" x2="810" y2="36" stroke="#1a3a8f" stroke-width="1"/>

  <!-- Row separators -->
  <line x1="10" y1="98"  x2="810" y2="98"  stroke="#1a3a8f" stroke-width="1"/>
  <line x1="10" y1="150" x2="810" y2="150" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="10" y1="230" x2="810" y2="230" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="10" y1="282" x2="810" y2="282" stroke="#1a3a8f" stroke-width="1"/>
  <line x1="10" y1="348" x2="810" y2="348" stroke="#1a3a8f" stroke-width="1"/>

  <!-- Agent labels -->
  <text x="65" y="72"  font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 1</text>
  <text x="65" y="129" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 2</text>
  <text x="65" y="195" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 3</text>
  <text x="65" y="261" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 4</text>
  <text x="65" y="320" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 5A</text>
  <text x="65" y="394" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a3a8f" text-anchor="middle">Agent 5B</text>

  <!-- Row 1 — Agent 1 -->
  <text x="136" y="58"  font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Monitors official sources (Tavily + Jina.ai), multi-topic,</text>
  <text x="136" y="76"  font-family="Segoe UI,sans-serif" font-size="12" fill="#222">auto pre-fill by category, persistent history</text>
  <text x="710" y="72"  font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Watch</text>

  <!-- Row 2 — Agent 2 -->
  <text x="136" y="129" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Extracts product specs</text>
  <text x="710" y="129" font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Profiler</text>

  <!-- Row 3 — Agent 3 -->
  <text x="136" y="178" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Classifies products against Decathlon&#39;s regulatory</text>
  <text x="136" y="196" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">framework (internal referentials legal/sub legal</text>
  <text x="136" y="214" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">categories)</text>
  <text x="710" y="195" font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Classifier</text>

  <!-- Row 4 — Agent 4 -->
  <text x="136" y="261" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Crosses alerts &#215; internal referentials or product</text>
  <text x="710" y="261" font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Impact</text>

  <!-- Row 5 — Agent 5A -->
  <text x="136" y="310" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Audits and proposes updates to</text>
  <text x="136" y="328" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">legal sheets by category</text>
  <text x="710" y="320" font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Legal Sheet</text>

  <!-- Row 6 — Agent 5B -->
  <text x="136" y="382" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">Generates product risk mapping with before/after</text>
  <text x="136" y="400" font-family="Segoe UI,sans-serif" font-size="12" fill="#222">comparison post Agent 5A updates</text>
  <text x="710" y="394" font-family="Segoe UI,sans-serif" font-size="12" fill="#2554d4" text-anchor="middle">Risk Map</text>
</svg>