<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7bb8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#f8f9ff"/>

  <!-- ── DATA SOURCES BANNER ── -->
  <rect x="30" y="20" width="620" height="90" rx="10" fill="#dde3f7"/>
  <text x="610" y="58" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#6b7bb8" text-anchor="middle">Data</text>
  <text x="610" y="74" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#6b7bb8" text-anchor="middle">sources</text>

  <!-- Pill 1 -->
  <rect x="48" y="34" width="160" height="62" rx="20" fill="#1a3a8f"/>
  <text x="128" y="58" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Regulations / Countries</text>
  <text x="128" y="73" font-family="Segoe UI,sans-serif" font-size="11" fill="white" text-anchor="middle">from database</text>

  <!-- Pill 2 -->
  <rect x="228" y="34" width="160" height="62" rx="20" fill="#1a3a8f"/>
  <text x="308" y="51" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Internal referentials</text>
  <text x="308" y="65" font-family="Segoe UI,sans-serif" font-size="11" fill="white" text-anchor="middle">Legal categories,</text>
  <text x="308" y="79" font-family="Segoe UI,sans-serif" font-size="11" fill="white" text-anchor="middle">sub-legal categories</text>

  <!-- Pill 3 -->
  <rect x="408" y="34" width="160" height="62" rx="20" fill="#1a3a8f"/>
  <text x="488" y="58" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">Product specs</text>
  <text x="488" y="73" font-family="Segoe UI,sans-serif" font-size="11" fill="white" text-anchor="middle">(decathlon.fr, PIM…)</text>

  <!-- ── CONNECTOR LINES sources → agents ── -->
  <!-- left branch → Agent 1 -->
  <line x1="128" y1="96" x2="128" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="128" y1="130" x2="200" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="200" y1="130" x2="200" y2="158" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- middle branch → Agent 1 + Agent 3 -->
  <line x1="308" y1="96" x2="308" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="200" y1="130" x2="430" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="430" y2="158" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- right branch → Agent 2 + Agent 3 -->
  <line x1="488" y1="96" x2="488" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="488" y1="130" x2="530" y2="130" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="530" y1="130" x2="530" y2="158" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── AGENT 1 ── -->
  <rect x="130" y="158" width="140" height="56" rx="24" fill="#2554d4"/>
  <text x="200" y="182" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 1</text>
  <text x="200" y="198" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Regulatory Watcher</text>

  <!-- ── AGENT 2 ── -->
  <rect x="360" y="158" width="140" height="56" rx="24" fill="#2554d4"/>
  <text x="430" y="182" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 2</text>
  <text x="430" y="198" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Product Profiler</text>

  <!-- ── AGENT 3 ── -->
  <rect x="460" y="248" width="140" height="56" rx="24" fill="#2554d4"/>
  <text x="530" y="272" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 3</text>
  <text x="530" y="288" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Regulatory Classifier</text>

  <!-- Agent 2 → Agent 3 -->
  <line x1="430" y1="214" x2="430" y2="232" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="430" y1="232" x2="530" y2="232" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="530" y1="232" x2="530" y2="248" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── AGENT 1 → AGENT 4 ── -->
  <line x1="200" y1="214" x2="200" y2="276" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Agent 3 → Agent 4 -->
  <line x1="530" y1="304" x2="530" y2="320" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="530" y1="320" x2="260" y2="320" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="260" y1="320" x2="260" y2="310" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── AGENT 4 ── -->
  <rect x="160" y="276" width="140" height="56" rx="24" fill="#2554d4"/>
  <text x="230" y="300" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 4</text>
  <text x="230" y="316" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Impact Analyzer</text>

  <!-- ── FORK Agent 4 → 5A + 5B ── -->
  <line x1="230" y1="332" x2="230" y2="368" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="110" y1="368" x2="350" y2="368" stroke="#9aa8d4" stroke-width="1.5"/>
  <line x1="110" y1="368" x2="110" y2="394" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="368" x2="350" y2="394" stroke="#9aa8d4" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── AGENT 5A ── -->
  <rect x="40" y="394" width="140" height="56" rx="24" fill="#7b9ef0"/>
  <text x="110" y="418" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 5A</text>
  <text x="110" y="434" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Legal Files</text>

  <!-- ── AGENT 5B ── -->
  <rect x="280" y="394" width="140" height="56" rx="24" fill="#7b9ef0"/>
  <text x="350" y="418" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Agent 5B</text>
  <text x="350" y="434" font-family="Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Risk Mapping</text>

  <!-- Dashed line 5A ↔ 5B -->
  <line x1="180" y1="422" x2="280" y2="422" stroke="#7b9ef0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ── LEGEND TABLE ── -->
  <rect x="660" y="20" width="220" height="390" rx="8" fill="white" stroke="#c8d0ec" stroke-width="1.5"/>

  <!-- Header line -->
  <line x1="660" y1="20" x2="880" y2="20" stroke="#c8d0ec" stroke-width="1.5"/>

  <!-- Row separators -->
  <line x1="660" y1="85"  x2="880" y2="85"  stroke="#e8ecf5" stroke-width="1"/>
  <line x1="660" y1="150" x2="880" y2="150" stroke="#e8ecf5" stroke-width="1"/>
  <line x1="660" y1="215" x2="880" y2="215" stroke="#e8ecf5" stroke-width="1"/>
  <line x1="660" y1="280" x2="880" y2="280" stroke="#e8ecf5" stroke-width="1"/>
  <line x1="660" y1="345" x2="880" y2="345" stroke="#e8ecf5" stroke-width="1"/>

  <!-- Agent labels -->
  <text x="675" y="46" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 1</text>
  <text x="675" y="112" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 2</text>
  <text x="675" y="177" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 3</text>
  <text x="675" y="242" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 4</text>
  <text x="675" y="307" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 5A</text>
  <text x="675" y="372" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a3a8f">Agent 5B</text>

  <!-- Descriptions -->
  <text x="675" y="60" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Monitors official sources (Tavily +</text>
  <text x="675" y="73" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Jina.ai), multi-topic, auto pre-fill</text>

  <text x="675" y="125" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Extracts product specs from the</text>
  <text x="675" y="138" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">web by model code</text>

  <text x="675" y="190" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Classifies products against</text>
  <text x="675" y="203" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">internal referentials</text>

  <text x="675" y="255" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Crosses alerts × referentials</text>
  <text x="675" y="268" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">or product catalog</text>

  <text x="675" y="320" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Audits and proposes updates to</text>
  <text x="675" y="333" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">"My Conformity Box" legal sheets</text>

  <text x="675" y="385" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">Risk mapping with before/after</text>
  <text x="675" y="398" font-family="Segoe UI,sans-serif" font-size="10.5" fill="#333">comparison post 5A updates</text>

</svg>
